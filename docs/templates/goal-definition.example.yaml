# 公开格式样例；程序不默认加载此文件。以下为虚构目标，不代表用户真实计划。
# 用户可手动复制到 private/goals.yaml 并修改；勿覆盖已有个人配置，不提交 Git。
# schema_version 是结构版本，当前支持 0.1.0；每个目标的 version 是正整数内容版本。
# 所有字段必需，未知字段会报错；目标 ID 唯一，状态为 active / paused / completed。
# target_date 使用带引号的合法 YYYY-MM-DD（如 "2026-12-31"）或 null。
schema_version: "0.1.0"
goals:
  - id: "agent-capability-example"
    version: 1
    name: "建立可展示的 Agent 工程能力"
    status: "active"
    description: "能够独立完成一个边界清楚的 Agent 项目，并解释设计与局限。"
    motivation: "用真实产出和反馈判断自己是否愿意继续投入这个方向。"
    target_date: null
    success_criteria:
      - "形成可以运行和演示的项目。"
      - "获得至少一次实际使用反馈，并记录改进。"
      - "能说明关键取舍和仍未解决的问题。"
    constraints:
      - "投入应与正常休息相容，不以持续透支换取进度。"
